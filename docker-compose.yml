services:
  web:
    image: imranshuvo101/gentsity-com-app:latest
    container_name: gentsity-com-app
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      - NODE_OPTIONS=--max-old-space-size=125
    env_file:
      - .env.local
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 80M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
